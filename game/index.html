<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMBERLINE — Tactical FPS</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #141210; }
  #game { position: fixed; inset: 0; }
  #game canvas { display: block; }
  .hidden { display: none !important; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: ui-monospace, Menlo, Consolas, monospace; color: #f2ead9; user-select: none; }
  /* Crosshair: four lines whose gap follows the weapon spread. */
  #crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; --gap: 8px; }
  #crosshair .ch { position: absolute; background: #f2ead9; box-shadow: 0 0 2px #000; }
  #crosshair .t { left: -1px; top: calc(-1 * var(--gap) - 8px); width: 2px; height: 8px; }
  #crosshair .b { left: -1px; top: var(--gap); width: 2px; height: 8px; }
  #crosshair .l { top: -1px; left: calc(-1 * var(--gap) - 8px); width: 8px; height: 2px; }
  #crosshair .r { top: -1px; left: var(--gap); width: 8px; height: 2px; }
  #crosshair .dot { left: -1px; top: -1px; width: 2px; height: 2px; }
  #hitmarker { position: absolute; left: 50%; top: 50%; width: 26px; height: 26px; margin: -13px 0 0 -13px; }
  #hitmarker::before, #hitmarker::after { content: ''; position: absolute; left: 12px; top: 0; width: 2px; height: 26px; background: #fff; }
  #hitmarker::before { transform: rotate(45deg); }
  #hitmarker::after { transform: rotate(-45deg); }
  #hitmarker.kill::before, #hitmarker.kill::after { background: #d43d2a; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(212,61,42,0.55) 100%); opacity: 0; }
  .panel { background: rgba(20,18,16,0.72); border: 1px solid rgba(242,234,217,0.18); border-radius: 4px; padding: 8px 12px; }
  #topbar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 18px; align-items: baseline; font-size: 15px; }
  #timer { font-size: 22px; font-weight: bold; }
  #timer.danger { color: #d43d2a; }
  #objective { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); font-size: 12px; color: #9a8f7a; }
  #feed { position: absolute; top: 12px; right: 14px; text-align: right; font-size: 12px; line-height: 1.7; color: #cfc4a8; white-space: pre-line; text-shadow: 0 1px 2px #000; }
  #bottom-left { position: absolute; left: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  #health-row { display: flex; align-items: center; gap: 8px; font-size: 20px; font-weight: bold; }
  #health-bar { width: 180px; height: 10px; background: rgba(0,0,0,0.5); border: 1px solid rgba(242,234,217,0.3); }
  #health-fill { height: 100%; width: 100%; background: #7fb069; }
  #health-fill.low { background: #d43d2a; }
  #bottom-right { position: absolute; right: 16px; bottom: 14px; text-align: right; }
  #ammo-mag { font-size: 34px; font-weight: bold; }
  #ammo-reserve { font-size: 16px; color: #9a8f7a; }
  #weapon-name { font-size: 12px; color: #cfc4a8; }
  #grenades { font-size: 13px; color: #e8862e; margin-top: 2px; }
  #money { position: absolute; left: 14px; bottom: 96px; font-size: 15px; color: #e8862e; }
  #banner { position: absolute; top: 26%; left: 0; right: 0; text-align: center; }
  #banner-title { font-size: 44px; font-weight: bold; letter-spacing: 6px; text-shadow: 0 2px 12px #000; }
  #banner-sub { font-size: 15px; color: #cfc4a8; margin-top: 6px; text-shadow: 0 1px 4px #000; }
  #plant-bar { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); width: 260px; text-align: center; }
  #plant-label { font-size: 13px; margin-bottom: 5px; text-shadow: 0 1px 2px #000; }
  #plant-track { height: 8px; background: rgba(0,0,0,0.55); border: 1px solid rgba(242,234,217,0.4); }
  #plant-fill { height: 100%; width: 0; background: #e8862e; }
  #buy-hint { position: absolute; bottom: 150px; left: 50%; transform: translateX(-50%); font-size: 13px; color: #e8862e; text-shadow: 0 1px 2px #000; }
  #buy-menu { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: auto; width: 520px; }
  #buy-menu h2 { margin: 0 0 10px; font-size: 16px; letter-spacing: 2px; }
  #buy-items { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .buy-card { font-family: inherit; text-align: left; background: rgba(40,34,28,0.9); color: #f2ead9; border: 1px solid rgba(232,134,46,0.5); border-radius: 4px; padding: 10px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; }
  .buy-card:hover { background: rgba(232,134,46,0.25); }
  .buy-card span { color: #e8862e; font-weight: bold; }
  .buy-card i { color: #9a8f7a; font-style: normal; font-size: 11px; }
  #overlay { position: absolute; inset: 0; background: rgba(10,9,8,0.82); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; pointer-events: auto; text-align: center; padding: 20px; }
  #overlay-title { font-size: 52px; font-weight: bold; letter-spacing: 10px; color: #e8862e; }
  #overlay-sub { font-size: 14px; line-height: 1.9; color: #cfc4a8; white-space: pre-line; }
  #overlay-btn { font-family: inherit; font-size: 16px; letter-spacing: 2px; background: #e8862e; color: #141210; border: none; border-radius: 4px; padding: 12px 28px; cursor: pointer; font-weight: bold; }
  #overlay-btn:hover { background: #f09a4a; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div id="vignette"></div>
  <div id="crosshair"><div class="ch t"></div><div class="ch b"></div><div class="ch l"></div><div class="ch r"></div><div class="ch dot"></div></div>
  <div id="hitmarker" class="hidden"></div>
  <div id="topbar" class="panel"><span id="round-label">ROUND 1</span><span id="timer">1:40</span><span id="score">V 0 — 0 S</span></div>
  <div id="objective">Plant the charge at site A or B — hold E inside a site</div>
  <div id="feed"></div>
  <div id="bottom-left">
    <div id="health-row"><span id="health-num">100</span><div id="health-bar"><div id="health-fill"></div></div></div>
  </div>
  <div id="money">$800</div>
  <div id="bottom-right">
    <div><span id="ammo-mag">12</span> <span id="ammo-reserve">/ 48</span></div>
    <div id="weapon-name">P12 Sidearm</div>
    <div id="grenades">◉ 0</div>
  </div>
  <div id="banner" class="hidden"><div id="banner-title"></div><div id="banner-sub"></div></div>
  <div id="plant-bar" class="hidden"><div id="plant-label"></div><div id="plant-track"><div id="plant-fill"></div></div></div>
  <div id="buy-hint" class="hidden">Press B to open the buy menu</div>
  <div id="buy-menu" class="panel hidden"><h2>BUY — ROUND SUPPLY</h2><div id="buy-items"></div></div>
  <div id="overlay">
    <div id="overlay-title">EMBERLINE</div>
    <div id="overlay-sub"></div>
    <button id="overlay-btn">CLICK TO DEPLOY</button>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
